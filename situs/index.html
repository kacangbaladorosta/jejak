*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Poppins,system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,#DDF3E9 0%,#EEF3FF 45%,#FFF1F7 100%);overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri-d)}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ---------- kerangka situs web ---------- */
:root{--sw:264px}
#stage{height:100%;display:flex}
#phone-wrap{flex:1;position:relative;min-width:0;height:100%;display:block}
#phone{position:absolute;inset:0;overflow:hidden;background:var(--mint);isolation:isolate}
#side{display:none}
.fakesb{display:none!important}
#menu-btn{display:flex}
.scr[data-lay=site] .scr-scroll,.scr[data-lay=auth] .scr-scroll{padding:0;--pb:0px}
.skip{position:absolute;left:12px;top:-60px;z-index:999;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;text-decoration:none;transition:top .2s}.skip:focus{top:12px}
@media (min-width:900px){
 #side{display:flex;flex-direction:column;gap:2px;width:var(--sw);flex:none;height:100%;padding:20px 14px 16px;background:#ffffffe6;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-right:1px solid #1E3A3314;overflow:auto;z-index:5;scrollbar-width:thin}
 body.land #side{display:none}
 #menu-btn{display:none!important}
 .nav{display:none!important}
 .scr.hasnav{--pb:56px}
 .scr-scroll{--pb:56px}
 .top{padding-top:30px}
 .scr[data-lay=narrow] .scr-scroll{padding-inline:max(0px,calc((100% - 600px)/2))}
 .scr[data-lay=mid] .scr-scroll{padding-inline:max(0px,calc((100% - 880px)/2))}
 .scr[data-lay=wide] .scr-scroll{padding-inline:max(8px,calc((100% - 1240px)/2))}
 .scr[data-lay=site] .scr-scroll,.scr[data-lay=auth] .scr-scroll{padding:0}
 #landbg{display:none}
 .scr .seg{max-width:560px}
 .cols{display:block!important;column-count:2;column-gap:20px}
 .cols>*{break-inside:avoid;margin:0 0 16px!important}
 .bgrid{grid-template-columns:repeat(5,1fr)!important}
 .modal-bg{align-items:center;justify-content:center;padding:24px}
 .modal{width:min(500px,100%);border-radius:32px;transform:scale(.92) translateY(20px)}
 #toasts{left:50%;right:auto;transform:translateX(-50%);width:min(460px,calc(100% - 32px));top:22px}
 .ptop{top:22px!important;max-width:640px}
 #psheet{left:24px!important;right:auto!important;bottom:24px!important;width:410px}
 .scr[data-id=peta] .map .zc{top:150px!important}
 .scr[data-id=jejak] #jmap{min-height:300px}
 .dtall{height:340px!important}
}
@media (min-width:1360px){.cols.c3{column-count:3}}
@media (max-width:899px){.cols>*{margin-bottom:12px}}
#side .brand{display:flex;gap:10px;align-items:center;font-size:24px;font-weight:700;letter-spacing:.02em;padding:2px 6px 10px}
#side .ucard{display:flex;gap:10px;align-items:center;background:var(--mint);border-radius:20px;padding:10px 12px;margin-bottom:6px;text-align:left;width:100%}
#side h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 4px 8px}
#side .nv{display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:14px;font-size:13.5px;font-weight:500;color:var(--ink);transition:.2s;width:100%}
#side .nv:hover{background:var(--mint)}
#side .nv.on{background:var(--pri-s);color:var(--pri-d);font-weight:700}
#side .sfoot{margin-top:auto;padding-top:14px}
#side .sfoot .seg{margin-bottom:8px}
#side .sfoot .seg button{height:32px;font-size:12px}
#side .lnk{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:700;color:var(--pri-d);padding:8px 10px;border-radius:12px;width:100%}
#side .lnk:hover{background:var(--mint)}
/* ---------- screens ---------- */
.scr{position:absolute;inset:0;background:var(--bg,linear-gradient(180deg,#EAF7F1,#FFF9EC));will-change:transform,opacity}
.scr-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:var(--pb,24px)}
.scr-scroll::-webkit-scrollbar{display:none}
.scr.hasnav{--pb:112px}
.fakesb{position:absolute;left:0;right:0;top:0;height:44px;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0 32px;font-size:14px;font-weight:700;z-index:30;pointer-events:none}
.fakesb.light{color:#fff}
.fakesb .r{display:flex;gap:6px;align-items:center}
.pad{padding:0 24px}
.top{padding:56px 24px 6px;display:flex;align-items:center;gap:12px}
.top h2{margin:0;font-size:calc(24px*var(--fs));line-height:1.2;font-weight:700}
.top .sub{font-size:calc(12.5px*var(--fs));color:var(--mut);margin-top:2px}
.top .grow{flex:1;min-width:0}
.rbtn{flex:none;width:44px;height:44px;border-radius:22px;background:#fff;box-shadow:var(--shadow-s);display:grid;place-items:center;position:relative;transition:transform .2s var(--ease)}
.rbtn:active{transform:scale(.92)}
.rbtn.dark{background:#ffffff33;box-shadow:none}
.dotred{position:absolute;right:9px;top:9px;width:10px;height:10px;border-radius:5px;background:#E5484D;border:2px solid #fff}
.dotred.pulse{animation:pulse 1.6s infinite}
/* typography helpers */
.t11{font-size:calc(11px*var(--fs))}.t12{font-size:calc(12px*var(--fs))}.t13{font-size:calc(13px*var(--fs))}.t14{font-size:calc(14px*var(--fs))}.t15{font-size:calc(15px*var(--fs))}.t16{font-size:calc(16px*var(--fs))}.t18{font-size:calc(18px*var(--fs))}.t20{font-size:calc(20px*var(--fs))}.t24{font-size:calc(24px*var(--fs))}.t28{font-size:calc(28px*var(--fs))}.t34{font-size:calc(34px*var(--fs))}
.b{font-weight:700}.m{font-weight:500}.mut{color:var(--mut)}.c{text-align:center}.r{text-align:right}.pri{color:var(--pri-d)}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}
.row{display:flex;align-items:center;gap:10px}.col{display:flex;flex-direction:column}.grow{flex:1;min-width:0}.gap8{gap:8px}.gap12{gap:12px}.wrap{flex-wrap:wrap}.sp{justify-content:space-between}
.h2{font-size:calc(18px*var(--fs));font-weight:700;margin:0}
.h3{font-size:calc(16px*var(--fs));font-weight:700;margin:0}
.fine{font-size:calc(11.5px*var(--fs));color:var(--mut);line-height:1.45}
/* ---------- komponen ---------- */
.card{background:#fff;border-radius:24px;box-shadow:var(--shadow-s);padding:16px;position:relative}
.card.pad0{padding:0;overflow:hidden}
.card.tap{transition:transform .2s var(--ease),box-shadow .2s;cursor:pointer;display:block;width:100%}
.card.tap:active{transform:scale(.985)}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:27px;font-weight:700;font-size:calc(15px*var(--fs));transition:transform .15s var(--ease),filter .2s;text-align:center}
.btn:active{transform:scale(.97)}
.btn.sm{height:44px;font-size:calc(13.5px*var(--fs));border-radius:22px}
.btn.xs{height:34px;font-size:calc(12.5px*var(--fs));border-radius:17px;padding:0 16px;width:auto}
.btn.big{height:68px;border-radius:34px;font-size:calc(18px*var(--fs))}
.btn.pri{background:linear-gradient(180deg,#1F9A6A,#177A54);color:#fff;box-shadow:var(--shadow-s)}
.btn.soft{background:var(--pri-s);color:var(--pri-d)}
.btn.warn{background:linear-gradient(180deg,#D2562F,#B23E22);color:#fff;box-shadow:var(--shadow-s)}
.btn.white{background:#fff;color:var(--pri-d);box-shadow:var(--shadow-s)}
.btn.lav{background:var(--lav-s);color:var(--lav-t)}
.btn.lime{background:var(--lime);color:var(--ink)}
.btn.dark{background:var(--ink);color:#fff}
.btn.pink{background:var(--pink-s);color:var(--pink-t)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn .rip,.chip .rip{position:absolute;border-radius:50%;background:#ffffff66;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
.btn.soft .rip,.btn.lav .rip,.btn.lime .rip,.btn.pink .rip{background:#17714b22}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:calc(11.5px*var(--fs));font-weight:500;white-space:nowrap}
.tag.ok{background:var(--pri-s);color:var(--pri-d)}.tag.warn{background:var(--warn-s);color:var(--warn)}.tag.amb{background:var(--amb-s);color:var(--amb)}.tag.red{background:var(--red-s);color:var(--red)}.tag.blue{background:var(--blu-s);color:var(--blu-t)}.tag.lav{background:var(--lav-s);color:var(--lav-t)}.tag.pink{background:var(--pink-s);color:var(--pink-t)}.tag.lime{background:var(--lime);color:var(--ink)}.tag.grey{background:#E9EFEC;color:var(--mut)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 24px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;background:#fff;box-shadow:var(--shadow-s);font-weight:500;font-size:calc(13px*var(--fs));transition:.2s;position:relative;overflow:hidden}
.chip.on{background:var(--pri);color:#fff}
.chip:active{transform:scale(.95)}
.seg{display:flex;background:#E4EEE9;border-radius:22px;padding:4px;gap:2px;position:relative}
.seg button{flex:1;height:36px;border-radius:18px;font-size:calc(12.5px*var(--fs));font-weight:500;color:var(--mut);text-align:center;transition:.25s var(--ease);position:relative;z-index:1}
.seg button.on{background:#fff;color:var(--pri-d);font-weight:700;box-shadow:var(--shadow-s)}
.toggle{flex:none;width:52px;height:30px;border-radius:15px;background:#CBD7D2;position:relative;transition:.25s}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 2px 6px #0003;transition:.25s var(--ease)}
.toggle.on{background:var(--pri)}.toggle.on::after{left:25px}
.prog{height:10px;border-radius:5px;background:#E3EEE8;position:relative;overflow:hidden}
.prog>i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,#6FD39A,var(--pri));width:0;transition:width 1s var(--ease)}
.prog.thin{height:8px}.prog.lg{height:12px}
.prog .mk{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--ink);border-radius:2px}
.iconbub{flex:none;display:grid;place-items:center;border-radius:50%}
.avatar{flex:none;width:44px;height:44px;border-radius:22px;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--lav-s);color:var(--lav-t)}
.field{display:block;margin-top:14px}
.field>span{display:block;font-size:calc(12.5px*var(--fs));color:var(--mut);font-weight:500;margin:0 0 6px 4px}
.inp{display:flex;align-items:center;gap:10px;height:54px;border-radius:20px;background:#fff;box-shadow:var(--shadow-s);padding:0 16px;border:2px solid transparent;transition:.2s}
.inp:focus-within{border-color:var(--pri)}
.inp input,.inp textarea,.inp select{flex:1;min-width:0;border:0;outline:0;background:none;font-size:calc(14.5px*var(--fs));height:100%}
.inp.err{border-color:#E5484D}
.errtxt{color:var(--red);font-size:12px;margin:4px 0 0 6px}
.bubble{position:relative;background:#fff;border-radius:18px;padding:10px 14px;font-size:calc(13px*var(--fs));font-weight:500;box-shadow:var(--shadow-s);line-height:1.4}
.bubble::after{content:"";position:absolute;left:24px;bottom:-9px;width:18px;height:12px;background:#fff;clip-path:polygon(0 0,100% 0,30% 100%)}
.bubble.r::after{left:auto;right:30px;clip-path:polygon(0 0,100% 0,70% 100%)}
.nav{position:absolute;left:0;right:0;bottom:0;height:92px;background:#fff;border-radius:30px 30px 0 0;box-shadow:0 -6px 24px #2D6A5A1A;display:flex;z-index:20;padding-bottom:12px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:calc(11px*var(--fs));font-weight:500;color:var(--mut);position:relative;transition:.2s}
.nav button .ni{width:44px;height:30px;border-radius:15px;display:grid;place-items:center;transition:.3s var(--ease)}
.nav button.on{color:var(--pri-d);font-weight:700}
.nav button.on .ni{background:var(--pri-s);transform:translateY(-2px)}
.nav button:active .ni{transform:scale(.88)}
.nav .scanb{margin-top:-30px}
.nav .scanb .ni{width:62px;height:62px;border-radius:31px;background:linear-gradient(135deg,#27B07E,var(--pri-d));box-shadow:0 8px 18px #177A5466;animation:breathe 3s infinite}
.nav .scanb span{margin-top:2px}
.hr{height:1px;background:var(--line);margin:12px 0}
.stagger>*{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:34px 34px 0 0;box-shadow:0 -8px 30px #2D6A5A33;z-index:25;padding:14px 20px 24px;transform:translateY(0);transition:transform .45s var(--ease)}
.sheet .grab{width:48px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.scenebg{position:absolute;left:0;right:0;top:0;overflow:hidden;pointer-events:none}
.scenebg svg{width:100%;height:100%}
.scenebg.drift svg{animation:drift 18s ease-in-out infinite alternate;transform-origin:50% 50%}
.mascot{display:inline-block;cursor:pointer;animation:bob 3.6s ease-in-out infinite;transform-origin:50% 100%;-webkit-user-select:none;user-select:none}
.mascot.jump{animation:jump .7s var(--ease)}
.mascot svg{width:100%;height:auto;overflow:visible}
.glow{box-shadow:0 0 0 0 #177A5455;animation:glow 2s infinite}
.skel{background:linear-gradient(90deg,#E8F1EC 25%,#F4FAF7 50%,#E8F1EC 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:12px}
/* modal / toast */
#layer{position:absolute;inset:0;z-index:60;pointer-events:none}
#toasts{position:absolute;left:16px;right:16px;top:50px;display:flex;flex-direction:column;gap:8px;z-index:70;pointer-events:none}
.toast{background:var(--ink);color:#fff;border-radius:18px;padding:12px 16px;font-size:calc(13px*var(--fs));font-weight:500;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px #0004;animation:toastin .5s var(--ease) both}
.toast.out{animation:toastout .35s ease-in forwards}
.toast .ti{flex:none;width:30px;height:30px;border-radius:15px;background:#ffffff22;display:grid;place-items:center}
.modal-bg{position:absolute;inset:0;background:#10302855;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);pointer-events:auto;opacity:0;transition:opacity .3s;display:flex;align-items:flex-end}
.modal-bg.show{opacity:1}
.modal-bg.center{align-items:center;justify-content:center;padding:24px}
.modal{background:#fff;width:100%;border-radius:34px 34px 0 0;padding:20px 22px 26px;max-height:88%;overflow:auto;transform:translateY(40px);transition:transform .45s var(--ease)}
.modal-bg.center .modal{border-radius:32px;transform:scale(.88)}
.modal-bg.show .modal{transform:none}
#confetti{position:absolute;inset:0;z-index:80;pointer-events:none;width:100%;height:100%}
.fly{position:absolute;z-index:90;font-weight:700;font-size:18px;color:var(--pri-d);pointer-events:none;text-shadow:0 2px 0 #fff,0 0 12px #fff;animation:flyup 1.3s var(--ease) forwards}
/* peta */
.map{position:absolute;inset:0;overflow:hidden;background:#E9F1E4;touch-action:none;cursor:grab}
.map:active{cursor:grabbing}
.map .tiles{position:absolute;inset:0;transform-origin:0 0}
.map .tiles img{position:absolute;width:256px;height:256px;max-width:none;opacity:0;transition:opacity .35s;image-rendering:auto}
.map .tiles img.ok{opacity:1}
.map svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.map .mk{position:absolute;left:0;top:0;transform:translate(-50%,-100%);cursor:pointer;will-change:transform}
.map .mk.dot{transform:translate(-50%,-50%)}
.map .attr{position:absolute;left:6px;bottom:4px;font-size:9.5px;color:#333;background:#ffffffcc;padding:1px 6px;border-radius:6px;pointer-events:auto;z-index:3}
.map .attr a{color:#245}
.map .gmload{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12px;font-weight:500;color:var(--mut);background:#fff;padding:8px 14px;border-radius:14px;box-shadow:var(--shadow-s);z-index:2}
.map .gmk.dot{transform:translateY(50%)}
.map .gmk .pinwrap{transform-origin:50% 100%}
.map .zc{position:absolute;right:16px;display:flex;flex-direction:column;background:#fff;border-radius:23px;box-shadow:var(--shadow);z-index:5;overflow:hidden}
.map .zc button{width:46px;height:46px;display:grid;place-items:center}
.map .zc button+button{border-top:1px solid var(--line)}
.pinwrap{filter:drop-shadow(0 4px 4px #0003);transition:transform .25s var(--ease)}
.pinwrap:hover,.pinwrap.sel{transform:scale(1.18) translateY(-3px)}
.pinwrap.bounce{animation:pinbounce .8s var(--ease)}
.me{width:36px;height:36px;border-radius:50%;background:#4A8DF044;display:grid;place-items:center;animation:pulse 2s infinite}
.me i{width:18px;height:18px;border-radius:50%;background:#4A8DF0;border:3px solid #fff;box-shadow:var(--shadow-s)}
.truck{width:34px;height:34px;border-radius:17px;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center}
.zone-pulse{animation:zonepulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.dash-flow{stroke-dasharray:1 10;animation:dashflow 1s linear infinite}
/* charts */
.chart .bar{transform-origin:50% 100%;animation:grow .9s var(--ease) both}
.chart text{font-family:Poppins;font-size:11px;fill:var(--mut)}
.tip{position:absolute;background:var(--ink);color:#fff;font-size:12px;padding:5px 10px;border-radius:10px;pointer-events:none;white-space:nowrap;transform:translate(-50%,-120%);z-index:5}
.tbl{width:100%;border-collapse:collapse;font-size:calc(12.5px*var(--fs))}
.tbl th{background:var(--pri-s);color:var(--pri-d);text-align:left;font-weight:700;padding:10px 8px;cursor:pointer;white-space:nowrap;position:sticky;top:0}
.tbl td{padding:9px 8px;border-bottom:1px solid #EEF3F0}
.tbl tr:nth-child(even) td{background:#F8FCFA}
.tbl tr.anom td{background:var(--amb-s)}
/* animasi */
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-6px) scale(1.01,.99)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes jump{0%{transform:translateY(0) scale(1.1,.88)}30%{transform:translateY(-34px) scale(.92,1.1)}60%{transform:translateY(0) scale(1.12,.88)}80%{transform:translateY(-8px)}100%{transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 #4A8DF066}70%{box-shadow:0 0 0 16px #4A8DF000}100%{box-shadow:0 0 0 0 #4A8DF000}}
@keyframes glow{0%{box-shadow:0 0 0 0 #177A5466}70%{box-shadow:0 0 0 14px #177A5400}100%{box-shadow:0 0 0 0 #177A5400}}
@keyframes rip{to{transform:scale(3);opacity:0}}
@keyframes drift{from{transform:scale(1.06) translateX(-8px)}to{transform:scale(1.06) translateX(8px)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes toastin{from{opacity:0;transform:translateY(-24px) scale(.9)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateY(-16px) scale(.95)}}
@keyframes flyup{0%{opacity:0;transform:translateY(10px) scale(.6)}15%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-90px) scale(1)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes dashflow{to{stroke-dashoffset:-22}}
@keyframes zonepulse{0%,100%{opacity:.9}50%{opacity:.45}}
@keyframes pinbounce{0%{transform:translateY(-40px);opacity:0}60%{transform:translateY(4px);opacity:1}80%{transform:translateY(-6px)}100%{transform:none}}
@keyframes inFwd{from{transform:translateX(100%)}to{transform:none}}
@keyframes outFwd{from{transform:none}to{transform:translateX(-28%);opacity:.5}}
@keyframes inBack{from{transform:translateX(-28%);opacity:.5}to{transform:none;opacity:1}}
@keyframes outBack{from{transform:none}to{transform:translateX(100%)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes scan{0%{top:6%}50%{top:90%}100%{top:6%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@keyframes sparkle{0%,100%{opacity:.2;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(90deg)}}
.scr.in-fwd{animation:inFwd .42s var(--ease) both;z-index:3}.scr.out-fwd{animation:outFwd .42s var(--ease) both;z-index:1}
.scr.in-back{animation:inBack .42s var(--ease) both;z-index:1}.scr.out-back{animation:outBack .42s var(--ease) both;z-index:3}
.scr.in-fade{animation:fadeIn .3s both;z-index:3}.scr.out-fade{animation:fadeOut .3s both;z-index:1}
.shake{animation:shake .45s}
.pop{animation:pop .6s var(--ease) both}
.laser{position:absolute;left:8%;right:8%;height:5px;border-radius:3px;background:var(--lime);box-shadow:0 0 18px #E3FC87cc;animation:scan 2.4s ease-in-out infinite}
.spark{position:absolute;animation:sparkle 1.6s infinite}

@keyframes draw{to{stroke-dashoffset:0}}

.lp-st b{font-size:calc(clamp(40px,5vw,60px)*var(--fs));line-height:1;color:var(--pri-d);letter-spacing:-.02em}
.lp-st span{font-size:15px;font-weight:500;line-height:1.4;max-width:280px}.lp-st small{font-size:12px;color:var(--mut)}
.lp-fine{font-size:12.5px;color:var(--mut);line-height:1.6}
.lp-a{color:var(--pri-d);font-weight:700;text-decoration:underline;text-underline-offset:3px;display:inline}
.lp-hd{max-width:660px;margin-bottom:32px}.lp-hd h2{font-size:calc(clamp(28px,3.6vw,42px)*var(--fs));line-height:1.12;margin-top:14px}.lp-hd p{margin-top:12px;color:var(--mut);font-size:16px;line-height:1.6}
.lp-steps,.lp-feats,.lp-prin,.lp-dgrid{display:grid;gap:16px}
.lp-step{position:relative;background:#fff;border-radius:32px;padding:26px;box-shadow:var(--shadow-s)}.lp-step h3{font-size:19px;margin:18px 0 8px}.lp-step p{color:var(--mut);font-size:14.5px;line-height:1.6}
.lp-num{position:absolute;right:22px;top:12px;font-size:64px;font-weight:700;color:var(--pri-s);line-height:1}
.lp-feat{background:#fff;border-radius:28px;padding:24px;box-shadow:var(--shadow-s);transition:transform .25s var(--ease),box-shadow .25s}.lp-feat:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.lp-feat h3{font-size:17px;margin:16px 0 6px}.lp-feat p{color:var(--mut);font-size:14px;line-height:1.6}
.lp-dcard{background:#fff;border-radius:32px;padding:28px;box-shadow:var(--shadow-s);display:grid;place-items:center;gap:16px}
.lp-leg{display:flex;flex-direction:column;gap:6px;font-size:13.5px;align-items:flex-start}.lp-leg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:8px}
.lp-dside{display:flex;flex-direction:column;gap:12px;justify-content:center}
.lp-kpi{background:#fff;border-radius:24px;padding:16px 22px;box-shadow:var(--shadow-s)}.lp-kpi b{display:block;font-size:28px;letter-spacing:-.01em;color:var(--pri-d)}.lp-kpi span{font-size:13.5px;color:var(--mut)}
.lp-pr{display:flex;gap:14px;align-items:flex-start;background:#ffffffb0;border-radius:26px;padding:20px}.lp-pr b{font-size:16px}.lp-pr p{font-size:13.5px;color:var(--mut);line-height:1.6;margin-top:4px}
.lp-faq details{background:#fff;border-radius:22px;box-shadow:var(--shadow-s);margin-bottom:12px;overflow:hidden}
.lp-faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px;font-weight:700;font-size:15.5px}.lp-faq summary::-webkit-details-marker{display:none}
.lp-faq details[open] summary svg{transform:rotate(180deg)}.lp-faq p{padding:0 22px 20px;color:var(--mut);font-size:14.5px;line-height:1.65}
.lp-cta2{background:linear-gradient(135deg,#177A54,#0F5A3E);color:#fff;border-radius:40px;padding:36px 28px;display:flex;flex-direction:column;gap:20px;align-items:flex-start;justify-content:space-between}
.lp-cta2 h2{font-size:calc(clamp(26px,3.4vw,38px)*var(--fs))}.lp-cta2 p{margin-top:8px;opacity:.88;font-size:16px}.lp-cta2 .btn{width:auto;padding:0 32px;flex:none}
.lp-foot{background:#fff;border-top:1px solid #1E3A3314}.lp-fgrid{display:grid;gap:26px}
.lp-fl{display:flex;flex-direction:column;gap:6px;margin-top:10px}.lp-fl button,.lp-fl a{font-size:13.5px;color:var(--mut);text-decoration:none;text-align:left}.lp-fl button:hover,.lp-fl a:hover{color:var(--pri-d);text-decoration:underline}
.lp-foot .lp-fine{margin-top:28px;padding-top:18px;border-top:1px solid #1E3A3310}
.lp-doc{max-width:760px;padding-top:28px}.lp-doc h1{font-size:calc(clamp(30px,4vw,42px)*var(--fs));margin:18px 0 6px}.lp-doc h2{font-size:19px;margin:28px 0 8px}.lp-doc p{line-height:1.7;color:#2c4a42;font-size:15px}
.lp-tbl{margin-top:14px;border-radius:18px;overflow:hidden;box-shadow:var(--shadow-s);background:#fff}
.lp-tbl>div{display:grid;grid-template-columns:1fr 1.3fr 1.2fr;gap:12px;padding:12px 16px;font-size:13.5px;border-top:1px solid #1E3A3310}.lp-tbl .h{font-weight:700;background:var(--pri-s);border-top:0}

/* ---------- masuk, onboarding, mode ---------- */
.auth{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr);overflow-x:clip}
.auth-art{position:relative;overflow:hidden;display:grid;place-items:center;min-height:300px;padding:24px 16px}
.auth-h{position:relative;width:390px;height:470px;border-radius:44px;overflow:hidden;box-shadow:0 24px 60px #1E3A3322;zoom:.78}

.kid-mas{position:absolute;left:0;right:0;bottom:3%;z-index:2;display:grid;place-items:center}

.scn-view{position:relative;flex:1;min-height:340px;overflow:hidden}
.scn-top{position:absolute;left:16px;right:16px;top:16px;z-index:4}
.scn-frame{position:absolute;left:50%;top:48%;width:min(300px,72%);height:min(270px,56%);transform:translate(-50%,-50%);z-index:3}
.scn-hint{position:absolute;left:0;right:0;bottom:18px;color:#ffffffcc;z-index:3;padding:0 20px}

 .scn-view{border-radius:40px;background:linear-gradient(180deg,#2F5148,#17302A);min-height:560px;box-shadow:var(--shadow)}
 .scn-panel{border-radius:36px;box-shadow:var(--shadow-s);align-self:center;padding:32px}}

.dn-grid{display:grid;gap:16px;margin-top:8px}
.dn-split{display:grid;gap:20px;margin-top:16px;align-items:center}

.dn-mag{display:grid;place-items:center;min-width:64px;height:64px;border-radius:20px;background:var(--amb-s);color:var(--amb);font-weight:700;font-size:18px}

.svc-d{width:12px;height:12px;border-radius:50%;background:#C9D6D0;flex:none}.svc-r.ok .svc-d{background:#1F9A6A}.svc-r.bad .svc-d{background:#E5484D}.svc-r.skip .svc-d{background:#E8A317}.svc-r.run .svc-d{animation:svcp .8s infinite alternate}

/* Pemetaan tag kemasan Open Food Facts ke jenis kemasan JEJAK. Urutan penting: yang paling spesifik dulu. */
function itemFromPack(tags,text){
  const t=(tags||[]).join(' ').toLowerCase()+' '+String(text||'').toLowerCase();
  const has=re=>re.test(t);
  if(has(/sachet|stick-pack|stickpack|sachê/))return 'sachet';
  if(has(/metallis|metaliz|multilayer|multi-layer|laminat|wrapper|bungkus|flow-?pack|snack/))return 'snack';
  if(has(/\bcan\b|en:can|steel-can|kaleng/)||(has(/aluminium|aluminum/)&&!has(/plastic|bottle|cup|pot|tray|lid|foil|carton/)))return 'can';
  if(has(/cup|gelas/))return 'cup';
  if(has(/carton|cardboard|paperboard|karton|kardus|paper-box|box/)&&!has(/plastic-bottle|bottle/))return 'box';
  if(has(/bag|kantong|plastic-film|film/))return 'bag';
  if(has(/bottle|botol|pet-1|polyethylene-terephthalate|\bpet\b/))return 'bottle';
  return null}

  if(/pengepul|lapak|rongsok|rosok|barang\s*bekas|loak|scrap/i.test(s))return 'Pengepul';
  if(/tps\s*3r|tps3r/i.test(s))return 'TPS 3R';
  if(t.amenity==='recycling'||t.craft==='recycling'||/daur\s*ulang|recycl/i.test(s))return 'Titik daur ulang';
  return 'Lainnya'}
/* pembaca jam buka OSM (bentuk umum saja). null = tidak bisa dipastikan */
function openNow(oh,now){if(!oh)return null;now=now||new Date();oh=String(oh).trim();if(/^24\/7$/i.test(oh))return true;
  const DN={su:0,mo:1,tu:2,we:3,th:4,fr:5,sa:6},d=now.getDay(),mins=now.getHours()*60+now.getMinutes();let matched=false,res=false;
  for(const part of oh.split(';')){const p=part.trim();if(!p)continue;
    const m=p.match(/^((?:(?:mo|tu|we|th|fr|sa|su)(?:\s*-\s*(?:mo|tu|we|th|fr|sa|su))?\s*,?\s*)+)?\s*((?:\d{1,2}:\d\d\s*-\s*\d{1,2}:\d\d\s*,?\s*)+|off|closed)$/i);if(!m)return null;
    let days=[0,1,2,3,4,5,6];if(m[1]){days=[];m[1].split(',').forEach(g=>{const r=g.trim().toLowerCase().split(/\s*-\s*/);const a=DN[r[0]],b=r[1]!=null?DN[r[1]]:a;let i=a;for(let k=0;k<8;k++){days.push(i);if(i===b)break;i=(i+1)%7}})}
    if(!days.includes(d))continue;matched=true;
    if(/off|closed/i.test(m[2])){res=false;continue}
    res=m[2].split(',').some(r=>{const x=r.trim().match(/(\d{1,2}):(\d\d)\s*-\s*(\d{1,2}):(\d\d)/);if(!x)return false;const a=+x[1]*60+ +x[2],b=+x[3]*60+ +x[4];return b>a?(mins>=a&&mins<b):(mins>=a||mins<b)})}
  return matched?res:false}
function bounds(c,r){const a=destPoint(c,-r,-r),b=destPoint(c,r,r);return {south:a[0],west:a[1],north:b[0],east:b[1]}}
async function overpass(c,r){
  const q=`[out:json][timeout:25];(nwr["amenity"="recycling"](around:${r},${c[0]},${c[1]});nwr["amenity"="waste_transfer_station"](around:${r},${c[0]},${c[1]});nwr["craft"="recycling"](around:${r},${c[0]},${c[1]});nwr["name"~"bank sampah|waste bank|TPS ?3R|pengepul|lapak|daur ulang|rongsok",i](around:${r},${c[0]},${c[1]}););out center tags 120;`;
  const eps=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];let err;
  for(const ep of eps){try{const j=await fetchSmart(ep+'?data='+encodeURIComponent(q),{proxy:false,ms:22000});
    return (j.elements||[]).map(e=>{const t=e.tags||{},ll=e.type==='node'?[e.lat,e.lon]:e.center?[e.center.lat,e.center.lon]:null;if(!ll)return null;
      const tipe=classify(t.name,t),jenis=[...new Set(Object.keys(t).filter(k=>/^recycling:/.test(k)&&t[k]==='yes').map(k=>JENIS_OSM[k.slice(10)]).filter(Boolean))];
      const addr=[t['addr:street'],t['addr:housenumber'],t['addr:village']||t['addr:suburb'],t['addr:city']||t['addr:district']].filter(Boolean).join(' ');
      return {id:'o'+e.type[0]+e.id,n:t.name||t['name:id']||(tipe==='Titik daur ulang'?'Titik daur ulang (tanpa nama)':'Tempat tanpa nama'),tipe,ll,jenis,oh:t.opening_hours||'',addr,tel:t.phone||t['contact:phone']||'',web:t.website||t['contact:website']||'',src:'osm',url:`https://www.openstreetmap.org/${e.type}/${e.id}`}}).filter(Boolean)}catch(e){err=e}}
  throw err||new Error('Overpass tidak bisa dijangkau')}
async function gPlaces(c,r){const {Place}=GM.places;const qs=['bank sampah','tempat daur ulang sampah','pengepul barang bekas'];const seen=new Map();
  const fields=['id','displayName','location','formattedAddress','regularOpeningHours','nationalPhoneNumber','googleMapsURI','businessStatus','types'];
  const rs=await Promise.all(qs.map(q=>Place.searchByText({textQuery:q,fields,locationRestriction:bounds(c,r),maxResultCount:20,region:'id',language:'id'}).then(x=>x.places||[]).catch(e=>{TT.gerr=String(e&&e.message||e);return []})));
  for(const pl of rs.flat()){if(seen.has(pl.id)||(pl.businessStatus&&pl.businessStatus!=='OPERATIONAL'))continue;
    const nm=pl.displayName||'Tanpa nama';let op=null;try{const v=await pl.isOpen();if(typeof v==='boolean')op=v}catch(e){}
    let jam='';try{const w=pl.regularOpeningHours&&pl.regularOpeningHours.weekdayDescriptions;if(w)jam=String(w[(new Date().getDay()+6)%7]||'').replace(/^[^:]+:\s*/,'')}catch(e){}
    seen.set(pl.id,{id:'g'+pl.id,n:nm,tipe:classify(nm,{amenity:(pl.types||[]).includes('recycling_center')?'recycling':''}),ll:[pl.location.lat(),pl.location.lng()],jenis:[],oh:'',open:op,jam,addr:pl.formattedAddress||'',tel:pl.nationalPhoneNumber||'',web:'',src:'google',url:pl.googleMapsURI||''})}
  return [...seen.values()]}
function mergeTitik(a,b){const out=a.slice();b.forEach(x=>{if(!out.some(y=>haversine(y.ll,x.ll)<70&&(slug(y.n)===slug(x.n)||haversine(y.ll,x.ll)<25)))out.push(x)});return out}
async function loadTitik(c,o={}){c=c||centerLL();const tok=++TT.tok;TT.st='loading';TT.c=c;TT.err='';TT.gerr='';TT.label=o.label||TT.label||'';document.dispatchEvent(new CustomEvent('titik'));
  try{let list=[],src='';
    if(GM.state==='ok'&&GM.places&&GM.places.Place){try{list=await gPlaces(c,8000);if(list.length)src='google'}catch(e){TT.gerr=String(e&&e.message||e)}}
    if(tok!==TT.tok)return;
    if(list.length<4){let osmErr=null,l2=[];for(const r of [3000,8000,20000]){try{l2=mergeTitik(l2,await overpass(c,r))}catch(e){osmErr=e;break}if(tok!==TT.tok)return;if(mergeTitik(list,l2).length>=4)break}
      if(osmErr&&!list.length&&!l2.length)throw osmErr;list=mergeTitik(list,l2);src=src?(l2.length?'google+osm':'google'):'osm'}
    list.forEach(t=>t._d=haversine(c,t.ll));list.sort((a,b)=>a._d-b._d);TT.list=list.slice(0,60);TT.src=src;TT.at=Date.now();TT.st=TT.list.length?'ok':'empty';
    try{S.tc={c,list:TT.list,at:TT.at,label:TT.label};save()}catch(e){}
  }catch(e){if(tok!==TT.tok)return;TT.st='err';TT.err=String(e&&e.message||e)}
  document.dispatchEvent(new CustomEvent('titik'))}

function titikList(){const c=refLL();return TT.list.map(t=>{const open=t.oh?openNow(t.oh):t.open!=null?t.open:null;return {...t,d:haversine(c,t.ll),open}}).sort((a,b)=>a.d-b.d)}

function zoomCtl(m,host,top){const z=document.createElement('div');z.className='zc';z.style.top=top+'px';
  z.innerHTML=`<button aria-label="Perbesar" data-z="1">${ic('plus',22,'var(--ink)',2.4)}</button><button aria-label="Perkecil" data-z="-1">${ic('minus',22,'var(--ink)',2.4)}</button>`;
  z.addEventListener('click',e=>{const b=e.target.closest('[data-z]');if(b){sfx('tap');m.zoomBy(+b.dataset.z)}});host.appendChild(z);return z}
const gmapsDir=ll=>`https://www.google.com/maps/dir/?api=1&destination=${ll[0].toFixed(6)},${ll[1].toFixed(6)}`;
const gmapsFind=(q,ll)=>`https://www.google.com/maps/search/${encodeURIComponent(q)}/@${ll[0].toFixed(5)},${ll[1].toFixed(5)},14z`;
const PF={layers:{titik:1,lapor:1,alert:1},jenis:'Semua',sel:null};
let pmap=null,pmk={titik:[],lapor:[],other:[]};
const SRC_LAB={google:'Google Maps',osm:'OpenStreetMap','google+osm':'Google Maps dan OpenStreetMap',tersimpan:'pencarian terakhir'};
reg('peta',{t:'15 Peta (titik setor)',sec:'C',nav:'auto',noscroll:true,
 render:()=>{
  const L=[['titik','Titik setor','pin'],['lapor','Laporanku','flag'],['alert','Peringatan','bell']];
  return `<div id="pmap" style="position:absolute;inset:0"></div>
  <div class="ptop" style="position:absolute;top:50px;left:0;right:0;z-index:6;pointer-events:none">
   <div class="pad row gap8" style="pointer-events:auto"><div class="card row gap8 grow" style="padding:0 16px;height:48px;border-radius:24px">${ic('search',20,'var(--mut)',2.2)}<input id="psearch" placeholder="Cari nama titik, atau ketik daerah lalu Enter" aria-label="Cari titik setor atau daerah" style="border:0;outline:0;background:none;flex:1;min-width:0;font-size:calc(14px*var(--fs))"></div>
    <button class="rbtn" style="width:48px;height:48px" data-act="locate" aria-label="Lokasiku" id="locbtn">${ic('target',22,'var(--pri)',2.3)}</button></div>
   <div class="chips" style="pointer-events:auto;margin-top:6px" id="pjenis">${['Semua','Buka sekarang','PET','Kardus','Sachet kering','Kaleng'].map(j=>chip(j,PF.jenis===j,{act:'pjenis'})).join('')}</div>
   <div class="chips" style="pointer-events:auto;margin-top:-4px" id="player">${L.map(([k,t,i])=>chip(t,PF.layers[k],{act:'player',arg:k,icon:i})).join('')}</div>
   <div class="c" style="pointer-events:none"><button class="btn pri sm" style="pointer-events:auto;display:inline-flex;width:auto;box-shadow:var(--shadow)" data-act="cariarea" id="cariarea">${ic('search',18,'currentColor',2.4)}<span>Cari di area ini</span></button></div></div>
  <div id="psheet" class="sheet" style="left:12px;right:12px;bottom:100px;border-radius:30px;padding:12px 18px 16px;min-height:132px;max-height:58vh;overflow:auto"></div>`},
 mount:(el,p)=>{const c0=(p&&p.center)||centerLL(),known=!!(S.geo||S.area);
   pmap=new MapView($('#pmap',el),{center:c0,zoom:known||(p&&p.center)?14:11,fallback:art('mapbase_wide',{slice:true,style:'width:100%;height:100%'}),minZoom:5});
   zoomCtl(pmap,$('#pmap',el),262);
   const q=$('#psearch',el);q.addEventListener('input',()=>{drawPeta();ensureSel();drawSheet()});
   q.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchEnter(q.value.trim())}});
   pmap.on('offline',()=>toast('Ubin peta tidak termuat. Menampilkan peta dasar ilustrasi.','wifi',3500));
   pmap.on('degraded',()=>toast('Google Maps tidak aktif ('+esc(GM.err||'gagal dimuat')+'). Memakai OpenStreetMap.','alert',5600));
   const onT=()=>{if(!pmap)return;drawPeta();ensureSel();drawSheet();if(TT.st==='ok'&&PF.fitNext){PF.fitNext=0;fitNearest()}};
   document.addEventListener('titik',onT);const onA=()=>{if(pmap)drawPeta()};document.addEventListener('bmkg',onA);
   if(!TT.list.length)titikFromCache(c0);
   if(known&&!(p&&p.center)&&(!TT.list.length||haversine(TT.c||c0,c0)>3000)){PF.fitNext=1;loadTitik(c0)}
   drawPeta();if(p&&p.focus&&titikById(p.focus)){PF.sel=p.focus;selTitik(p.focus)}else{ensureSel();drawSheet()}
   loadBMKG();
   return()=>{document.removeEventListener('titik',onT);document.removeEventListener('bmkg',onA);pmap&&pmap.destroy();pmap=null}}});
const accepts=(t,j)=>!t.jenis||!t.jenis.length||t.jenis.includes(j);
function sortedTitik(){const q=($('#psearch')||{value:''}).value.trim().toLowerCase();
  return titikList().filter(t=>(PF.jenis==='Semua'||(PF.jenis==='Buka sekarang'?t.open===true:accepts(t,PF.jenis)))&&(!q||t.n.toLowerCase().includes(q)||t.tipe.toLowerCase().includes(q)||(t.addr||'').toLowerCase().includes(q)))}
function ensureSel(){const l=sortedTitik();if(!PF.sel||!l.find(t=>t.id===PF.sel))PF.sel=l[0]?l[0].id:null}
function fitNearest(){if(!pmap)return;const l=titikList().slice(0,5).map(t=>t.ll);if(S.geo)l.push(S.geo);if(l.length>1)pmap.fit(l,90);else if(l.length)pmap.flyTo(l[0],15,600)}
function drawPeta(){if(!pmap)return;const m=pmap;
  [...pmk.titik,...pmk.lapor,...pmk.other].forEach(x=>x.remove());pmk={titik:[],lapor:[],other:[]};
  if(m._ov)m._ov.forEach(s=>s.remove());m._ov=[];
  if(PF.layers.alert)alertsAll().filter(a=>a.ll).forEach(a=>{const col=LVC[a.lvl][2];
    if(a.r)m._ov.push(m.addCircle(a.ll,a.r,{attrs:{fill:col,'fill-opacity':.14,stroke:col,'stroke-width':2,'stroke-dasharray':'7 6'}}));
    pmk.other.push(m.addMarker(a.ll,`<span class="iconbub" style="width:36px;height:36px;background:#fff;color:${col};box-shadow:var(--shadow)">${ic(a.ic||'alert',18,col,2.4)}</span>`,{dot:1,onClick:()=>go('peringatan_d',{id:a.id})}))});
  if(PF.layers.lapor)S.lapor.filter(r=>r.ll).forEach(r=>pmk.lapor.push(m.addMarker(r.ll,`<div class="pinwrap" style="width:26px">${art('pin_blue')}</div>`,{onClick:()=>openModal(`<div class="row gap12">${iconbub('flag',48,'var(--peach)','var(--peach-t)',24)}<div><b class="t16">${esc(r.jenis)}</b><div class="t12 mut">Laporanmu · ${dateStr(r.t)}</div></div></div><div class="card mt12" style="box-shadow:none;background:var(--mint)"><div class="t13"><b>Merek:</b> ${esc(r.merek||'-')}</div><div class="t13 mt4"><b>Masalah:</b> ${esc(r.masalah)}</div></div><div class="mt16">${btn('Tutup',{kind:'soft',act:'closeModal'})}</div>`)})));
  const list=sortedTitik();
  if(PF.layers.titik)list.forEach(t=>pmk.titik.push(m.addMarker(t.ll,`<div class="pinwrap ${PF.sel===t.id?'sel':''}" data-tid="${esc(t.id)}" style="width:${PF.sel===t.id?44:36}px">${art(TITIK_ICON[t.tipe]||'pin_green')}</div>`,{onClick:()=>selTitik(t.id)})));
  if(S.geo)pmk.other.push(m.addMarker(S.geo,`<div class="me"><i></i></div>`,{dot:1}))}
function selTitik(id,quiet){PF.sel=id;const t=titikById(id);if(pmap&&t&&!quiet){pmap.flyTo(t.ll,Math.max(pmap.zoom,15),700)}
  if(pmap)$$('.pinwrap[data-tid]',pmap.el).forEach(e=>{const on=e.dataset.tid===id;e.classList.toggle('sel',on);e.style.width=on?'44px':'36px'});drawSheet();if(!quiet)sfx('tap')}
function drawSheet(){const s=$('#psheet');if(!s||!pmap)return;const sup=S.mode==='pengawas',c=pmap.center();const grab='<div class="grab"></div>';
  const foot=`<div class="fine mt8">Jam dan jenis yang diterima bisa berubah. Cek atau hubungi dulu sebelum berangkat. <a href="${gmapsFind('bank sampah',c)}" target="_blank" rel="noopener">Cari "bank sampah" di Google Maps</a>.</div>`;
  if(TT.st==='loading'&&!TT.list.length){s.innerHTML=`${grab}<div class="row gap12">${iconbub('pin',54,'var(--pri-s)','var(--pri)',26)}<div class="grow"><b class="t14">Mencari titik setor...</b><div class="skel mt8" style="height:12px;width:70%"></div><div class="skel mt8" style="height:12px;width:45%"></div></div></div>`;return}
  if(TT.st==='idle'&&!TT.list.length){s.innerHTML=`${grab}<div class="c" style="padding:6px 0">${iconbub('target',54,'var(--pri-s)','var(--pri)',26)}<b class="t16" style="display:block;margin-top:8px">Mulai dari lokasimu</b><div class="t12 mut mt4" style="line-height:1.5">Izinkan lokasi supaya JEJAK mencari bank sampah dan titik daur ulang terdekat. Atau ketik nama daerah di kolom cari, lalu tekan Enter.</div><div class="mt12">${btn('Izinkan lokasi',{kind:'pri',icon:'target',cls:'sm',act:'locate'})}</div></div>`;return}
  if(TT.st==='err'&&!TT.list.length){s.innerHTML=`${grab}<div class="c" style="padding:6px 0">${iconbub('wifi',54,'var(--amb-s)','var(--amb)',26)}<b class="t16" style="display:block;margin-top:8px">Pencarian belum berhasil</b><div class="t12 mut mt4" style="line-height:1.5">${esc(TT.err||'Server peta tidak terjangkau.')} Coba lagi sebentar lagi.</div><div class="row gap8 mt12" style="justify-content:center">${btn('Coba lagi',{kind:'pri',icon:'refresh',cls:'sm',act:'cariarea'})}<a class="btn soft sm" href="${gmapsFind('bank sampah',c)}" target="_blank" rel="noopener">${ic('globe',18,'currentColor',2.2)}<span>Google Maps</span></a></div></div>`;return}
  if(TT.st==='empty'&&!TT.list.length){s.innerHTML=`${grab}<div class="c" style="padding:6px 0">${iconbub('search',54,'var(--amb-s)','var(--amb)',26)}<b class="t16" style="display:block;margin-top:8px">Belum ada titik tercatat di sini</b><div class="t12 mut mt4" style="line-height:1.5">Peta komunitas belum lengkap di semua daerah. Geser peta ke daerah lain lalu tekan "Cari di area ini", atau cari langsung di Google Maps.</div><div class="mt12"><a class="btn pri sm" href="${gmapsFind('bank sampah',c)}" target="_blank" rel="noopener">${ic('globe',18,'currentColor',2.2)}<span>Buka Google Maps</span></a></div></div>`;return}
  const t=PF.sel&&titikById(PF.sel),n=sortedTitik().length;
  if(!t){s.innerHTML=`${grab}<div class="c mut t13" style="padding:10px 0">Tidak ada titik yang cocok dengan filter ini. Coba filter lain.</div>${foot}`;return}
  const jam=jamTxt(t);
  s.innerHTML=`${grab}<div class="row gap12" style="animation:rise .4s var(--ease) both">${iconbub('pin',54,'var(--pri-s)','var(--pri)',26)}<div class="grow" style="min-width:0"><b class="t16" style="display:block;overflow-wrap:anywhere">${esc(t.n)}</b><span class="t12 mut">${t.tipe} · ${fmtDist(t.d)}</span><div class="row gap8 mt4 wrap">${t.open===true?tag('Buka sekarang','ok'):t.open===false?tag('Tutup sekarang','amb'):tag('Jam belum tercatat','grey')}${jam?`<span class="t11 mut">${esc(jam)}</span>`:''}</div></div></div>
   ${t.addr?`<div class="t12 mut mt8" style="line-height:1.45">${esc(t.addr)}</div>`:''}
   <div class="row gap8 wrap mt8">${t.jenis&&t.jenis.length?t.jenis.map(j=>`<span class="tag lav">${j}</span>`).join(''):`<span class="t11 mut">Jenis yang diterima belum tercatat</span>`}</div>
   <div class="row gap8 mt12 wrap">${btn('Rute',{kind:'soft',icon:'nav',cls:'sm',act:'rute',arg:t.id})}${t.tel?`<a class="btn soft sm" href="tel:${esc(String(t.tel).replace(/[^+\d]/g,''))}">${ic('send',18,'currentColor',2.2)}<span>Telepon</span></a>`:''}${sup?btn('Buat pengumuman',{kind:'pri',icon:'bell',go:'p_peringatan',cls:'sm'}):btn('Setor di sini',{kind:'pri',icon:'box',go:'setor',p:{titik:t.id},cls:'sm'})}</div>
   <div class="fine mt8">${n} titik tampil · sumber ${SRC_LAB[TT.src]||'OpenStreetMap'}${TT.st==='loading'?' · memperbarui...':''}.</div>${foot}`}
ACT.rute=el=>{const t=titikById(el.dataset.arg);if(t)window.open(gmapsDir(t.ll),'_blank','noopener')};
ACT.pjenis=el=>{PF.jenis=el.dataset.arg;$$('#pjenis .chip').forEach(c=>c.classList.toggle('on',c.dataset.arg===PF.jenis));PF.sel=null;sfx('tap');drawPeta();ensureSel();drawSheet();const t=PF.sel&&titikById(PF.sel);if(t&&pmap)pmap.flyTo(t.ll,Math.max(pmap.zoom,14),600)};
ACT.player=el=>{const k=el.dataset.arg;PF.layers[k]=PF.layers[k]?0:1;el.classList.toggle('on',!!PF.layers[k]);sfx('tap');drawPeta()};
ACT.locate=el=>{const b=$('#locbtn');if(b)b.style.animation='spin 1s linear infinite';geoGet(ll=>{if(b)b.style.animation='';toast('Lokasimu ditemukan. Mencari titik setor terdekat...','target');PF.sel=null;PF.fitNext=1;if(pmap)pmap.flyTo(ll,14,800);loadTitik(ll);drawPeta()},msg=>{if(b)b.style.animation='';toast(msg+'. Ketik nama daerahmu di kolom cari lalu tekan Enter.','alert',4600)})};
ACT.cariarea=()=>{if(!pmap)return;const c=pmap.center();PF.sel=null;PF.fitNext=0;sfx('tap');loadTitik(c)};
async function searchEnter(q){if(!q)return;const l=sortedTitik();if(l.length&&l[0].n.toLowerCase().includes(q.toLowerCase())){selTitik(l[0].id);return}
  toast('Mencari daerah "'+esc(q)+'"...','search',1800);
  try{const g=await geocode(q);if(!g){toast('Daerah tidak ditemukan. Coba nama kecamatan atau kota.','alert',3600);return}
    S.area={ll:g.ll,label:g.label};save();const i=$('#psearch');if(i)i.value='';PF.sel=null;PF.fitNext=0;if(pmap)pmap.flyTo(g.ll,14,900);loadTitik(g.ll,{label:g.label});toast('Menampilkan '+esc(g.label),'pin',2600)}
  catch(e){toast('Pencarian daerah gagal. Periksa koneksimu.','wifi',3600)}}

/* ---------- Peringatan dini ---------- */
let pcat='Semua',pq='';
reg('peringatan',{t:'16 Peringatan dini',sec:'C',nav:'auto',
 render:()=>{loadBMKG();
  return `${topbar('Peringatan dini',{back:null,sub:'Gempa dan cuaca dari BMKG',right:`<button class="rbtn" data-act="markseen" aria-label="Tandai semua sudah dibaca">${ic('check',22,'var(--pri)',2.6)}</button>`})}
  <div id="bmkgbox" class="pad mt12"></div>
  <div class="chips mt8" id="pcat">${['Semua','Cuaca','Gempa','Pengumuman'].map(c=>chip(c,pcat===c,{act:'pcat'})).join('')}</div>
  <div class="pad mt8"><div class="inp" style="height:44px">${ic('search',18,'var(--mut)',2.2)}<input id="pqa" placeholder="Cari wilayah, misalnya Jawa Barat" value="${esc(pq)}" aria-label="Cari wilayah"></div></div>
  <div class="pad col gap12 stagger cols c3 mt8" id="alist"></div>
  <div class="pad"><div class="fine mt16">Peringatan cuaca dan gempa berasal dari data terbuka BMKG dan mencakup seluruh Indonesia. Untuk keputusan keselamatan, selalu rujuk bmkg.go.id. Pengumuman buatan pengelola hanya tersimpan di perangkat pembuatnya.</div></div>`},
 mount:el=>{drawBMKG();drawAlerts();$('#pqa',el).oninput=e=>{pq=e.target.value;drawAlerts()};const h=()=>{drawBMKG();drawAlerts()};document.addEventListener('bmkg',h);return()=>document.removeEventListener('bmkg',h)}});
function alertCards(A){
  if(!A.length){const loading=BMKG.st==='loading'||BMKG.st==='idle';
    return loading?[0,1,2].map(()=>`<div class="card row gap12" style="padding:14px"><span class="skel" style="width:54px;height:54px;border-radius:20px;flex:none"></span><span class="grow"><div class="skel" style="height:14px;width:75%"></div><div class="skel mt8" style="height:11px;width:50%"></div></span></div>`).join('')
     :empty('bell',BMKG.st==='live'?'Tidak ada peringatan yang cocok':'Peringatan belum bisa dimuat',BMKG.st==='live'?'Coba kategori atau kata kunci lain. Kabar baik kalau memang sedang tidak ada.':'Data BMKG belum terjangkau dari peramban ini. Coba muat ulang, atau buka bmkg.go.id langsung.')}
  return A.map((a,i)=>{const c=LVC[a.lvl];return `<button class="card tap row gap12" style="--i:${Math.min(i,10)};padding:14px;${S.seenAlert[a.id]?'':'box-shadow:0 0 0 2px '+c[2]+'66,var(--shadow-s)'}" data-go="peringatan_d" data-p='{"id":"${a.id}"}'>${iconbub(a.ic||'alert',54,c[0],c[1],26)}<span class="grow" style="min-width:0"><b class="t14" style="display:block;overflow-wrap:anywhere">${esc(a.t)}</b><span class="row gap8 mt4">${tag(a.lvl,LVK[a.lvl])}${a.mine?tag('Pengumumanmu','lav'):tag(a.cat,'grey')}</span><span class="t12 mut" style="display:block;margin-top:4px">${esc(a.wil)} · ${esc(a.jam)}</span></span>${ic('chev',20,'var(--mut)',2.2)}</button>`}).join('')}
function filteredAlerts(){const q=pq.trim().toLowerCase();return alertsAll().filter(a=>(pcat==='Semua'||a.cat===pcat)&&(!q||(a.t+' '+a.wil).toLowerCase().includes(q)))}
function drawAlerts(){const b=$('#alist');if(b)b.innerHTML=alertCards(filteredAlerts())}
function drawBMKG(){const b=$('#bmkgbox');if(!b)return;const g=BMKG.gempa,live=BMKG.st==='live';
  const st=BMKG.st==='loading'||BMKG.st==='idle'?tag('Memuat...','amb'):live?tag('Data hidup BMKG','ok','wifi'):tag('Tidak tersambung','amb','alert');
  b.innerHTML=`<div class="card" style="background:linear-gradient(135deg,#fff,#EAF4FF);border-radius:28px"><div class="row sp"><b class="t14">Info BMKG</b>${st}</div>
   ${g?`<div class="row gap12 mt12">${iconbub('alert',52,'var(--blu-s)','var(--blu-t)',26)}<div class="grow"><b class="t13" style="display:block">Gempa terkini: M ${esc(g.Magnitude)}</b><span class="t12 mut" style="display:block;line-height:1.4">${esc(g.Wilayah)}</span><span class="t11 mut">${esc(g.Tanggal)} ${esc(g.Jam)} · kedalaman ${esc(g.Kedalaman)}</span></div></div>`
    :`<div class="t12 mut mt12" style="line-height:1.5">${BMKG.st==='loading'||BMKG.st==='idle'?'Mengambil data gempa dan cuaca dari BMKG...':'Data gempa belum bisa diambil.'}</div>`}
   <div class="row sp mt12"><span class="fine">Sumber: BMKG (data.bmkg.go.id)${BMKG.at?' · '+new Date(BMKG.at).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):''}</span><button class="t12 b pri" data-act="bmkgrefresh">Muat ulang</button></div>
   ${BMKG.st==='offline'?`<div class="fine mt4">Peramban tidak bisa menjangkau server BMKG (kemungkinan diblokir CORS atau koneksi terputus). Buka <a href="https://www.bmkg.go.id/" target="_blank" rel="noopener">bmkg.go.id</a> untuk informasi resmi.</div>`:''}</div>`}
ACT.bmkgrefresh=()=>{BMKG.st='idle';drawBMKG();loadBMKG(true);toast('Mengambil data BMKG...','wifi',1800)};
ACT.pcat=el=>{pcat=el.dataset.arg;$$('#pcat .chip').forEach(c=>c.classList.toggle('on',c.dataset.arg===pcat));drawAlerts();sfx('tap')};
ACT.markseen=()=>{alertsAll().forEach(a=>S.seenAlert[a.id]=1);save();toast('Semua peringatan ditandai sudah dibaca.','check');go('peringatan',{}, {dir:'fade'})};

reg('peringatan_d',{t:'17 Detail peringatan',sec:'C',nav:null,
 render:p=>{const a=alertsAll().find(x=>x.id===p.id)||(p.id?null:alertsAll()[0]);p.a=a;
  if(!a)return `${topbar('Detail peringatan')}<div class="pad mt16">${empty('bell','Peringatan ini sudah tidak aktif','Daftar BMKG diperbarui terus, jadi peringatan lama bisa hilang. Lihat daftar terbaru.',btn('Lihat peringatan',{kind:'pri',cls:'sm',go:'peringatan'}))}</div>`;
  const c=LVC[a.lvl];S.seenAlert[a.id]=1;save();
  return `<div class="dtall" style="position:relative;height:260px">${a.ll?`<div id="dmap" style="position:absolute;inset:0"></div>`:scene('scene_rain',260)}<div style="position:absolute;top:0;left:0;right:0;z-index:6">${topbar(' ',{})}</div></div>
  <div class="pad" style="margin-top:-24px;position:relative;z-index:7"><div class="card" style="border-radius:30px;padding:20px 20px 18px;animation:rise .5s var(--ease) both">
   <div class="row gap8">${tag(a.lvl,LVK[a.lvl],'alert')}${tag(a.cat,'lav')}</div><h2 class="t20 b" style="margin:10px 0 4px;overflow-wrap:anywhere">${esc(a.t)}</h2>
   <div class="t13 mut">${esc(a.wil)} · ${esc(a.jam)}</div><p class="t14 mt12" style="line-height:1.55;margin-bottom:0">${esc(a.msg)}</p></div>
   <h3 class="h2 mt20">Yang bisa kamu lakukan</h3>
   <div class="col gap8 mt12 stagger">${(a.tips||[]).map((t,i)=>`<button class="card tap row gap12" style="--i:${i};padding:14px" data-act="tipdone"><span class="tk" style="width:26px;height:26px;border-radius:13px;background:var(--pri-s);display:grid;place-items:center;flex:none;transition:.3s"></span><span class="grow t13 m">${esc(t)}</span></button>`).join('')}</div>
   <div class="fine mt16">Sumber: ${esc(a.src)}${a.mine?' · dibuat olehmu, hanya tersimpan di perangkat ini':''}</div>
   <div class="row gap8 mt16 wrap">${a.ll?btn('Lihat di peta',{kind:'soft',icon:'pin',go:'peta',cls:'sm',p:{center:a.ll}}):''}${a.url?`<a class="btn soft sm" href="${esc(a.url)}" target="_blank" rel="noopener">${ic('globe',18,'currentColor',2.2)}<span>Buka sumber</span></a>`:''}${btn('Bagikan',{kind:'pri',icon:'share',act:'sharealert',arg:a.id,cls:'sm'})}</div></div>`},
 mount:(el,p)=>{const a=p.a;if(!a)return;speak('Peringatan '+a.lvl+'. '+a.t+'. '+a.msg);if(!a.ll)return;const col=LVC[a.lvl][2];

function dlBlob(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600)}
async function svgPng(name,size=512){let svg=art(name);svg=svg.replace('<svg ',`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" `);
  const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));const img=new Image();await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});
  const cv=document.createElement('canvas');cv.width=cv.height=size;cv.getContext('2d').drawImage(img,0,0,size,size);URL.revokeObjectURL(url);return new Promise(res=>cv.toBlob(res,'image/png'))}

function daily(n,o={}){const t0=TODAY(),L=filterLog(o),out=[];for(let i=n-1;i>=0;i--){const d=t0-i*DAY;out.push({t:d,scans:0,ok:0,bad:0,kg:0})}

const sum=a=>a.reduce((x,y)=>x+y,0),mean=a=>a.length?sum(a)/a.length:0,sd=a=>{const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))};

function lineChart(series,o={}){const W=o.W||CW(),H=o.h||150,pl=36,pb=22,pt=10,n=series[0].v.length;const all=series.flatMap(s=>s.v).filter(v=>v!=null);const mx=o.max!=null?o.max:(Math.max(...all)*1.1||1),mn=o.min!=null?o.min:0;

  let rows=D.map(d=>{const z=(d.scans-m)/s;return {...d,acc:pct(d.ok,d.scans),sach:pct(d.bad,d.scans),z,flag:d.scans>0&&z>1.8?'Lonjakan':z<-1.8||(d.scans===0&&m>1.5)?'Turun':'',kgv:full?d.kg:null}});

  const k=AF.sort;rows.sort((a,b)=>((a[k]??-1)-(b[k]??-1))*AF.dir);return {rows,D,m,s,sc}}
function forecast(D){const y=D.map(d=>d.scans),n=y.length,xs=y.map((_,i)=>i),mx=mean(xs),my=mean(y);const sl=sum(xs.map((x,i)=>(x-mx)*(y[i]-my)))/(sum(xs.map(x=>(x-mx)**2))||1),ic0=my-sl*mx;
  const wd=Array(7).fill(0),wn=Array(7).fill(0);D.forEach(d=>{const w=new Date(d.t).getDay();wd[w]+=d.scans;wn[w]++});const fac=wd.map((v,i)=>wn[i]?(v/wn[i])/(my||1):1);
  return {sl,pred:Array.from({length:7},(_,i)=>{const t=D[n-1].t+(i+1)*DAY,w=new Date(t).getDay();return {t,v:Math.max(0,(ic0+sl*(n+i))*fac[w])}})}}

 mount:el=>{const K=KS();$('#kd',el).oninput=e=>{K.dasar=Math.max(2000,Math.min(2028,parseInt(e.target.value)||2019));save();drawKSum()};$('#kl',el).oninput=e=>{K.lap=Math.max(2000,Math.min(2035,parseInt(e.target.value)||K.lap));save();drawKSum()};drawKRows();drawKSum()}});
function drawKRows(){const b=$('#krows');if(!b)return;const K=KS();
  if(!K.rows.length){b.innerHTML=empty('table','Belum ada baris','Tambahkan satu baris per produk, lini, atau merek yang ingin kamu hitung.',btn('Tambah baris',{kind:'pri',icon:'plus',cls:'sm',act:'kadd'}));return}
  const f=(r,k,l)=>`<label class="field" style="margin:0"><span>${l}</span><div class="inp" style="height:42px"><input data-k="${k}" data-id="${r.id}" inputmode="decimal" value="${r[k]===''?'':esc(r[k])}" placeholder="0"></div></label>`;
  b.innerHTML=K.rows.map(r=>`<div class="card" style="border-radius:24px"><div class="row gap8"><div class="inp grow" style="height:42px">${ic('factory',18,'var(--mut)',2)}<input data-k="nama" data-id="${r.id}" value="${esc(r.nama)}" placeholder="Nama produk atau lini" maxlength="50" aria-label="Nama baris"></div><button class="rbtn" style="width:40px;height:40px" data-act="kdel" data-arg="${r.id}" aria-label="Hapus baris">${ic('trash',17,'var(--warn)',2.2)}</button></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px" class="mt8">${f(r,'base','Timbulan tahun dasar (ton)')}${f(r,'now','Timbulan tahun ini (ton)')}${f(r,'daur','Didaur ulang (ton)')}${f(r,'pakai','Dimanfaatkan kembali (ton)')}</div><div id="kr-${r.id}" class="mt8"></div></div>`).join('');
  $$('#krows input').forEach(i=>i.addEventListener('input',()=>{const r=K.rows.find(x=>x.id===i.dataset.id);if(!r)return;r[i.dataset.k]=i.value;save();drawKSum()}))}
function drawKSum(){const K=KS(),T=kTarget(K),ag=kAgg(K),c=kCalc(ag),st=kStat(c,T);const s=$('#ksum');if(!s)return;
  s.innerHTML=`<div class="card" style="border-radius:28px;background:linear-gradient(135deg,#F2FFE8,#fff)"><div class="row sp"><b class="t14">Ringkasan semua baris</b>${tag(st[0],st[1])}</div>
   <div class="row gap8 mt12">${[['Capaian',c?kNum(c.tot)+'%':'-'],['Target jalur '+K.lap,kNum(T)+'%'],['Target '+REG.tahun,REG.persen+'%']].map(([a,b])=>`<div class="grow card c" style="padding:10px 4px;box-shadow:none;background:#fff"><b class="t18 pri">${b}</b><div class="t11 mut">${a}</div></div>`).join('')}</div>
   ${c?`<div class="row gap8 mt8">${[['R1 pembatasan',c.r1],['R2 daur ulang',c.r2],['R3 manfaat kembali',c.r3]].map(([a,b])=>`<div class="grow card c" style="padding:8px 2px;box-shadow:none;background:var(--mint)"><b class="t14">${kNum(b)}%</b><div class="t11 mut">${a}</div></div>`).join('')}</div><div class="mt12">${prog(Math.max(0,Math.min(1,c.tot/REG.persen)),{mark:T/REG.persen*100,col:c.tot>=T?'':'#F2A93B'})}</div><div class="fine mt4">Garis penanda = target jalur tahun ${K.lap}.</div>`:''}</div>`;
  K.rows.forEach(r=>{const e=$('#kr-'+r.id);if(!e)return;const cc=kCalc(r),s2=kStat(cc,T);e.innerHTML=cc?`<div class="row sp t12"><span>R1 <b>${kNum(cc.r1)}%</b> · R2 <b>${kNum(cc.r2)}%</b> · R3 <b>${kNum(cc.r3)}%</b></span>${tag(kNum(cc.tot)+'%',s2[1])}</div>`:`<div class="t11 mut">Isi timbulan tahun dasar untuk melihat hasil.</div>`})}
ACT.kadd=()=>{const K=KS();K.rows.push({id:'r'+Date.now().toString(36),nama:'',base:'',now:'',daur:'',pakai:''});save();drawKRows();drawKSum();sfx('tap')};
ACT.kdel=el=>{const K=KS();K.rows=K.rows.filter(r=>r.id!==el.dataset.arg);save();drawKRows();drawKSum();sfx('tap')};
function kRowsOut(){const K=KS(),T=kTarget(K);return K.rows.map(r=>{const c=kCalc(r);return {nama:r.nama||'(tanpa nama)',base:num(r.base),now:num(r.now),daur:num(r.daur),pakai:num(r.pakai),c,T,st:kStat(c,T)[0]}})}
ACT.kcsv=()=>{const L=kRowsOut();if(!L.length){toast('Belum ada baris untuk diunduh.','alert',2600);return}download('jejak-target-2029.csv',['Nama,Dasar_ton,Sekarang_ton,Daur_ton,Pakai_ton,R1_persen,R2_persen,R3_persen,Total_persen,Target_jalur_persen,Status',...L.map(p=>[csvc(p.nama),p.base,p.now,p.daur,p.pakai,p.c?p.c.r1.toFixed(1):'',p.c?p.c.r2.toFixed(1):'',p.c?p.c.r3.toFixed(1):'',p.c?p.c.tot.toFixed(1):'',p.T.toFixed(1),csvc(p.st)].join(','))].join('\n'));toast('Berkas CSV diunduh.','download')};
ACT.kcetak=()=>{const L=kRowsOut(),K=KS();if(!L.length){toast('Belum ada baris untuk dicetak.','alert',2600);return}$('#printarea').innerHTML=`<h1 style="font-family:Poppins">JEJAK · Pencatat target ${REG.tahun}</h1><p>Tahun dasar ${K.dasar}, pelaporan ${K.lap}. Dicetak ${new Date().toLocaleString('id-ID')}. Alat bantu hitung, bukan penilaian resmi.</p><table class="tbl"><thead><tr><th>Nama</th><th>Dasar (ton)</th><th>Sekarang (ton)</th><th>Daur (ton)</th><th>Pakai ulang (ton)</th><th>R1 %</th><th>R2 %</th><th>R3 %</th><th>Total %</th><th>Target %</th><th>Status</th></tr></thead><tbody>${L.map(p=>`<tr><td>${esc(p.nama)}</td><td>${p.base}</td><td>${p.now}</td><td>${p.daur}</td><td>${p.pakai}</td><td>${p.c?kNum(p.c.r1):'-'}</td><td>${p.c?kNum(p.c.r2):'-'}</td><td>${p.c?kNum(p.c.r3):'-'}</td><td>${p.c?kNum(p.c.tot):'-'}</td><td>${kNum(p.T)}</td><td>${p.st}</td></tr>`).join('')}</tbody></table>`;setTimeout(()=>window.print(),80)};

function donut(parts,o={}){const sz=o.size||200,th=o.th||28,R=(sz-th)/2,C=2*Math.PI*R,tot=parts.reduce((a,p)=>a+p.v,0)||1;let off=0;
  return `<svg viewBox="0 0 ${sz} ${sz}" width="${sz}" height="${sz}" role="img" aria-label="${esc(o.label||'Diagram donat')}" style="max-width:100%;height:auto"><circle cx="${sz/2}" cy="${sz/2}" r="${R}" fill="none" stroke="#E6EFEA" stroke-width="${th}"/>${parts.map(p=>{const len=C*p.v/tot;const e=`<circle cx="${sz/2}" cy="${sz/2}" r="${R}" fill="none" stroke="${p.c}" stroke-width="${th}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${sz/2} ${sz/2})"/>`;off+=len;return e}).join('')}${o.center?`<text x="50%" y="48%" text-anchor="middle" font-size="${sz/6.2}" font-weight="700" fill="#1E3A33" font-family="Poppins,sans-serif">${o.center}</text><text x="50%" y="62%" text-anchor="middle" font-size="${sz/16}" fill="#4F6B62" font-family="Poppins,sans-serif">${o.sub||''}</text>`:''}</svg>`}
function hbars(items,o={}){const mx=Math.max(1,...items.map(i=>i.v));return `<div class="hb" role="list">${items.map(i=>`<div class="hb-r" role="listitem"><span class="hb-l" title="${esc(i.l)}">${esc(i.l)}</span><span class="hb-t"><span class="hb-f" style="width:${Math.max(2,i.v/mx*100)}%;background:${i.c||o.c||'var(--pri)'}"></span></span><span class="hb-v">${o.fmt?o.fmt(i.v):fmt(i.v)}</span></div>`).join('')}</div>`}

docPage('privasi','Kebijakan privasi','Kebijakan privasi','8 Oktober 2026',()=>`
 <h2>Singkatnya</h2><p>JEJAK tidak meminta akun, email, atau kata sandi. Nama panggilan dan semua catatanmu (scan, setoran, laporan, misi, dan pengaturan) disimpan di penyimpanan browser perangkatmu. Catatan itu tidak dikirim ke server JEJAK.</p>
 <h2>Yang keluar dari perangkatmu</h2><p>Beberapa fitur harus bertanya ke layanan pihak ketiga. Mereka bisa melihat alamat IP dan permintaan yang kamu kirim, sesuai kebijakan masing-masing.</p>
 <div class="lp-tbl" role="table"><div role="row" class="h"><span>Fitur</span><span>Layanan</span><span>Yang dikirim</span></div>
 ${[['Scan barcode','Open Food Facts','Angka barcode'],['Peta dan titik setor','Google Maps dan Places, atau OpenStreetMap, Overpass, Nominatim','Koordinat atau nama daerah yang kamu cari'],['Peringatan','BMKG','Hanya permintaan data publik, tanpa lokasimu'],['Berita','GDELT atau Google Berita lewat perantara','Kata kunci topik, bukan identitasmu'],['Statistik pengunjung','Google Analytics','Hanya bila kamu mengizinkan dan situs mengaktifkannya'],['Data komunitas','Supabase','Hanya bila diaktifkan dan kamu mengizinkan; berisi data anonim']].map(r=>`<div role="row">${r.map(c=>`<span>${c}</span>`).join('')}</div>`).join('')}</div>
 <h2>Lokasi dan kamera</h2><p>Browser akan meminta izin saat kamu menekan tombol lokasi atau kamera. Foto barcode diproses di perangkatmu dan tidak diunggah. Kamu bisa mencabut izin kapan saja lewat pengaturan browser.</p>
 <h2>Mengunduh dan menghapus</h2><p>Di menu Profil kamu bisa mengunduh seluruh datamu dan menghapusnya sekaligus. Menghapus data browser juga menghapus semua catatan JEJAK.</p>
 <h2>Anak-anak</h2><p>Mode Cilik dirancang untuk didampingi orang tua atau guru. Mode ini tidak mengumpulkan data pribadi tambahan.</p>
 <h2>Perubahan dan kontak</h2><p>Bila kebijakan ini berubah, tanggal di atas ikut diperbarui. ${CFG.KONTAK?`Pertanyaan bisa dikirim ke <a href="mailto:${esc(CFG.KONTAK)}">${esc(CFG.KONTAK)}</a>.`:'Pengelola situs dapat mencantumkan alamat kontak di konfigurasi.'}</p>`);
docPage('syarat','Syarat pemakaian','Syarat pemakaian','8 Oktober 2026',()=>`
 <h2>Tentang JEJAK</h2><p>JEJAK adalah alat bantu mandiri untuk memahami dan mencatat pengelolaan kemasan plastik. JEJAK bukan layanan resmi pemerintah, produsen, atau bank sampah mana pun.</p>
 <h2>Informasi bersifat umum</h2><p>Cara membuang dan tingkat kemudahan daur ulang adalah panduan umum menurut jenis kemasan, bukan penilaian terhadap produk atau merek tertentu. Aturan setempat dan kebijakan bank sampah dapat berbeda.</p>
 <h2>Data pihak ketiga</h2><p>Produk, peta, berita, serta peringatan gempa dan cuaca berasal dari pihak ketiga dan bisa terlambat, keliru, atau tidak tersedia. Untuk keputusan darurat, rujuk kanal resmi BMKG atau pemerintah daerahmu.</p>
 <h2>Laporan dan pertanyaan ke produsen</h2><p>Isi laporan menjadi tanggung jawab pengirimnya. Tuliskan fakta dan hindari data pribadi orang lain. JEJAK tidak mengirim laporan atas namamu; kamu menyalin dan mengirimnya sendiri lewat kanal resmi.</p>
 <h2>Pemakaian yang wajar</h2><p>Jangan memakai JEJAK untuk menyebarkan peringatan palsu, mengganggu layanan, atau mengambil data secara massal.</p>
 <h2>Batas tanggung jawab</h2><p>JEJAK disediakan apa adanya. Kami berusaha akurat, tetapi tidak menjamin ketersediaan atau ketepatan data, dan tidak bertanggung jawab atas keputusan yang diambil hanya berdasarkan aplikasi ini.</p>`);

const DN={brands:{st:'idle',items:[],total:0,err:''},trends:'idle',comm:{st:'idle',items:[]}};
async function loadComm(){if(!DB.on())return;DN.comm.st=DN.comm.st==='ok'?'ok':'loading';try{DN.comm={st:'ok',items:(await DB.brandStats()).map(r=>({l:r.brand,v:+r.scans})),at:Date.now()}}catch(e){DN.comm={st:'err',items:[],err:String(e&&e.message||e)}}document.dispatchEvent(new CustomEvent('dn'))}
async function loadBrands(){if(DN.brands.st==='loading')return;DN.brands.st='loading';document.dispatchEvent(new CustomEvent('dn'));
  const urls=['https://id.openfoodfacts.org/brands.json','https://world.openfoodfacts.org/country/indonesia/brands.json'];
  try{const j=await Promise.any(urls.map(u=>timeoutFetch(u,16000).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})));
    const t=(j.tags||[]).filter(x=>x&&x.name&&x.products>0).map(x=>({l:String(x.name),v:+x.products})).sort((a,b)=>b.v-a.v).slice(0,12);
    if(!t.length)throw new Error('data kosong');DN.brands={st:'ok',items:t,total:+j.count||0,err:'',at:Date.now()}}
  catch(e){DN.brands.st='err';DN.brands.err=String(e&&e.errors?e.errors[0]&&e.errors[0].message:e&&e.message||e)}
  document.dispatchEvent(new CustomEvent('dn'))}
function loadTrends(host){if(!host)return;host.innerHTML='<div class="skel" style="height:260px;border-radius:18px"></div>';let done=false;
  const fail=()=>{if(done)return;done=true;host.innerHTML=`<div class="fine" style="padding:8px 2px">Grafik Google Trends tidak bisa dimuat dari peramban ini. <a href="https://trends.google.com/trends/explore?geo=ID&q=bank%20sampah,daur%20ulang%20plastik&date=today%2012-m" target="_blank" rel="noopener noreferrer">Buka di Google Trends</a>.</div>`};
  const mk=()=>{if(done||!window.trends||!trends.embed)return fail();host.innerHTML='';try{trends.embed.renderExploreWidgetTo(host,'TIMESERIES',{comparisonItem:[{keyword:'bank sampah',geo:'ID',time:'today 12-m'},{keyword:'daur ulang plastik',geo:'ID',time:'today 12-m'}],category:0,property:''},{exploreQuery:'geo=ID&q=bank%20sampah,daur%20ulang%20plastik&date=today%2012-m',guestPath:'https://trends.google.com:443/trends/embed/'});done=true}catch(e){fail()}};
  if(window.trends&&trends.embed)return mk();
  const s=document.createElement('script');s.src='https://ssl.gstatic.com/trends_nrtr/4017_RC01/embed_loader.js';s.async=true;s.onload=()=>setTimeout(mk,150);s.onerror=fail;document.head.appendChild(s);setTimeout(()=>{if(!done&&!(window.trends&&trends.embed))fail()},9000)}
function drawDN(){const b=$('#dn-brands');if(!b)return;const B=DN.brands;
  if(B.st==='ok')b.innerHTML=hbars(B.items,{c:'var(--lav-t)'})+`<div class="fine mt12">Jumlah produk dengan merek ini yang tercatat di Open Food Facts untuk Indonesia${B.total?` (dari ${fmt(B.total)} merek terdata)`:''}. Ini ukuran kelengkapan database komunitas, bukan penjualan atau pangsa pasar.</div>`;
  else if(B.st==='err')b.innerHTML=`<div class="fine">Data merek belum bisa dimuat (${esc(B.err||'tidak diketahui')}). <button class="lp-a" data-act="dnbrands">Coba lagi</button> atau <a href="https://id.openfoodfacts.org/brands" target="_blank" rel="noopener noreferrer">buka langsung di Open Food Facts</a>.</div>`;
  else b.innerHTML=[0,1,2,3,4,5].map(()=>`<div class="skel" style="height:22px;margin:10px 0"></div>`).join('');
  const cm=$('#dn-comm');if(cm){const C=DN.comm;$('#dn-commtag').innerHTML=DB.on()?(C.st==='ok'?tag('Hampir langsung','ok','wifi'):''):tag('Segera hadir','lav');
    cm.innerHTML=!DB.on()?`<div class="row gap12">${iconbub('users',48,'var(--lav-s)','var(--lav-t)',24)}<span class="t12 mut" style="line-height:1.55">Merek dan bahan kemasan yang paling sering dipindai semua pengguna akan muncul di sini setelah database komunitas diaktifkan. Sementara ini angka scan hanya ada di perangkatmu.</span></div>`
     :C.st==='ok'?(C.items.length?hbars(C.items,{c:'var(--pri)'})+`<div class="fine mt12">Merek yang paling sering dipindai pengguna JEJAK yang mengizinkan statistik. Merek baru tampil setelah dipindai beberapa kali. Diperbarui tiap menit.</div>`:`<div class="fine">Belum cukup data. Merek tampil setelah dipindai beberapa kali oleh pengguna berbeda.</div>`)
     :C.st==='err'?`<div class="fine">Data komunitas belum bisa dimuat (${esc(C.err||'')}).</div>`:`<div class="skel" style="height:80px"></div>`}
  const g=$('#dn-gempa');if(g){const e=BMKG.gempa;g.innerHTML=e?`<div class="row gap12"><span class="dn-mag">M ${esc(String(e.Magnitude||'-'))}</span><span class="grow"><b class="t14" style="display:block;line-height:1.35">${esc(e.Wilayah||'')}</b><span class="t12 mut">${esc(e.Tanggal||'')} ${esc(e.Jam||'')} · kedalaman ${esc(e.Kedalaman||'-')}</span></span></div><button class="btn soft sm mt12" data-go="peringatan"><span>Lihat semua peringatan</span></button>`:BMKG.st==='offline'?`<div class="fine">Data BMKG belum bisa dimuat. <button class="lp-a" data-act="dnbmkg">Coba lagi</button></div>`:`<div class="skel" style="height:64px"></div>`}}
ACT.dnbrands=()=>loadBrands();ACT.dnbmkg=()=>loadBMKG(true);

 ['BMKG: gempa terkini',()=>fetchSmart('https://data.bmkg.go.id/DataMKG/TEWS/autogempa.json',{proxy:false,ms:9000}).then(j=>j.Infogempa.gempa.Wilayah)],

 ['Nominatim: cari daerah',()=>fetchSmart('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=Bandung',{proxy:false,ms:9000}).then(j=>j[0]&&j[0].display_name.slice(0,40))],
 ['Open Food Facts: produk',()=>fetchSmart('https://world.openfoodfacts.org/api/v2/product/3017620422003.json?fields=code,product_name',{proxy:false,ms:10000}).then(j=>j.product&&j.product.product_name||'status '+j.status)],
 ['Berita: GDELT',()=>NEWS_ROUTES[0][1]('Semua','',NEWS_CATS[0][2]).then(r=>r.length+' berita')],
 ['Berita: allorigins',()=>NEWS_ROUTES[2][1]('Semua',NEWS_CATS[0][1]).then(r=>r.length+' berita')],
 ['Berita: corsproxy',()=>NEWS_ROUTES[3][1]('Semua',NEWS_CATS[0][1]).then(r=>r.length+' berita')],
 ['Berita: rss2json',()=>NEWS_ROUTES[4][1]('Semua',NEWS_CATS[0][1]).then(r=>r.length+' berita')],
 ['Google Maps (kunci API)',()=>gkey()?GM.load().then(ok=>{if(!ok)throw new Error(GM.err||'gagal');return 'dimuat'}):Promise.reject(new Error('belum ada kunci, memakai OpenStreetMap'))],
 ['Supabase (database)',()=>CFG.SUPABASE_URL?timeoutFetch(CFG.SUPABASE_URL+'/rest/v1/',6000,{headers:{apikey:CFG.SUPABASE_KEY||''}}).then(r=>{if(!r.ok&&r.status!==404)throw new Error('HTTP '+r.status);return 'terjangkau'}):Promise.reject(new Error('belum dikonfigurasi'))]];
const SV={res:{}};
function drawSvc(){const b=$('#svc');if(!b)return;b.innerHTML=SVC.map(([n],i)=>{const r=SV.res[i];const st=!r?'run':r.ok?'ok':r.skip?'skip':'bad';
  return `<div class="svc-r ${st}"><span class="svc-d"></span><span class="grow"><b class="t13">${esc(n)}</b><span class="t12 mut" style="display:block">${!r?'Menguji...':esc(r.msg||'')}</span></span><span class="t12 b">${!r?'':r.ok?r.ms+' ms':r.skip?'Lewati':'Gagal'}</span></div>`}).join('')}
function runSvc(){SV.res={};drawSvc();SVC.forEach(([n,fn],i)=>{const t0=performance.now();Promise.resolve().then(fn).then(m=>{SV.res[i]={ok:1,ms:Math.round(performance.now()-t0),msg:String(m||'ok')}}).catch(e=>{const m=String(e&&e.message||e);SV.res[i]={ok:0,skip:/belum/.test(m),ms:Math.round(performance.now()-t0),msg:m}}).finally(drawSvc)})}
ACT.svcrun=()=>runSvc();
ACT.svccopy=()=>{const tx='JEJAK status layanan '+new Date().toISOString()+'\n'+location.protocol+'//'+location.host+'\n'+SVC.map(([n],i)=>{const r=SV.res[i]||{};return n+': '+(r.ok?'OK '+r.ms+'ms':r.skip?'LEWATI':'GAGAL')+' '+(r.msg||'')}).join('\n');
  (navigator.clipboard?navigator.clipboard.writeText(tx):Promise.reject()).then(()=>toast('Hasil disalin.','check',1800)).catch(()=>{const m=openModal(`<h3 class="t18 b" style="margin:0">Salin manual</h3><textarea style="width:100%;height:220px;margin-top:10px;border-radius:12px;padding:10px" readonly>${esc(tx)}</textarea>`)})};

/* ===== analitik opsional (GA4) dan database komunitas (Supabase) =====
   Keduanya mati kecuali pengelola mengisi GA_ID atau SUPABASE_URL dan SUPABASE_KEY di JEJAK_CONFIG,
   dan pengunjung menekan "Izinkan". Tidak ada pelacak lain. */
const AN={ga:0};
const anWanted=()=>!!(CFG.GA_ID||(CFG.SUPABASE_URL&&CFG.SUPABASE_KEY));
function gaLoad(){if(AN.ga||!CFG.GA_ID||S.consent!=='ya')return;AN.ga=1;window.dataLayer=window.dataLayer||[];window.gtag=function(){dataLayer.push(arguments)};
  gtag('js',new Date());gtag('config',CFG.GA_ID,{send_page_view:false,anonymize_ip:true,allow_google_signals:false,allow_ad_personalization_signals:false});
  const s=document.createElement('script');s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id='+encodeURIComponent(CFG.GA_ID);document.head.appendChild(s)}
function track(name,params){if(AN.ga&&window.gtag){try{gtag('event',name,params||{})}catch(e){}}}
function onScreen(id){track('page_view',{page_title:document.title,page_path:'/'+id})}
const DB={on:()=>!!(CFG.SUPABASE_URL&&CFG.SUPABASE_KEY),
 async rest(path,opt={}){const h=Object.assign({apikey:CFG.SUPABASE_KEY,Authorization:'Bearer '+CFG.SUPABASE_KEY,'Content-Type':'application/json'},opt.headers||{});
  const r=await timeoutFetch(CFG.SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/'+path,10000,Object.assign({},opt,{headers:h}));if(!r.ok)throw new Error('HTTP '+r.status);return r.status===204?null:r.json()},
 /* hanya merek, jenis kemasan, dan asal scan. Tanpa nama, lokasi, atau pengenal perangkat. */
 scan(e){if(!DB.on()||S.consent!=='ya')return;const brand=String(e.brand||'').trim().slice(0,60);
  DB.rest('scan_events',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({brand:brand||null,brand_slug:brand?slug(brand).slice(0,60):null,material:String(e.item||'').slice(0,20),source:e.code?'barcode':'manual'})}).catch(()=>{})},
 brandStats(){return DB.rest('brand_stats?select=brand,scans&order=scans.desc&limit=12')}};
/* spanduk persetujuan */
function drawConsent(){let b=document.getElementById('consent');
  if(!anWanted()||S.consent){if(b)b.remove();return}
  if(b)return;b=document.createElement('div');b.id='consent';b.setAttribute('role','dialog');b.setAttribute('aria-label','Persetujuan statistik');
  b.innerHTML=`<p><b>Boleh JEJAK mencatat statistik anonim?</b> ${CFG.GA_ID?'Kunjungan halaman dikirim ke Google Analytics. ':''}${DB.on()?'Merek dan jenis kemasan yang kamu pindai ikut dihitung di data komunitas, tanpa nama dan lokasi. ':''}Kamu bisa mengubahnya di Profil. <button class="lp-a" data-go="privasi">Baca privasi</button></p><div class="row gap8"><button class="btn xs soft" data-act="consent" data-arg="tidak">Tolak</button><button class="btn xs pri" data-act="consent" data-arg="ya">Izinkan</button></div>`;
  document.body.appendChild(b)}
ACT.consent=el=>{S.consent=el.dataset.arg;save();drawConsent();if(S.consent==='ya'){gaLoad();onScreen(cur&&cur.id)}else toast('Baik, tidak ada statistik yang dikirim.','check',2200)};
ACT.gantiConsent=()=>{S.consent='';save();drawConsent()};

/* ===== penangkap error front-end: pesan ramah untuk pengguna, catatan lokal untuk pengembang ===== */
const APP_VERSION='2026.10.08';
const ERRLOG=[];let _errToast=0;
function logErr(kind,msg,src){const e={t:Date.now(),kind,msg:String(msg||'').slice(0,300),src:String(src||'').slice(0,120),scr:cur&&cur.id||''};ERRLOG.push(e);if(ERRLOG.length>30)ERRLOG.shift();try{localStorage.setItem('jejak.errlog',JSON.stringify(ERRLOG))}catch(_){}
  if(Date.now()-_errToast>20000){_errToast=Date.now();try{toast('Ada yang tidak berjalan semestinya. Coba muat ulang halaman bila berlanjut.','alert',4200)}catch(_){}}}
addEventListener('error',ev=>{if(ev.target&&ev.target!==window)return;logErr('error',ev.message,(ev.filename||'')+':'+ev.lineno)});
addEventListener('unhandledrejection',ev=>{const r=ev.reason;logErr('promise',r&&r.message||r)});
/* service worker: hanya di https atau localhost, jaringan lebih dulu agar versi baru selalu menang */

  ${Object.keys(secs).sort().map(k=>`<h3>${SECN[k]}</h3><div class="sl">${secs[k].map(id=>`<button data-act="jump" data-arg="${id}" data-sid="${id}"><i>${SCR[id].t.slice(0,2)}</i>${SCR[id].t.slice(3)}</button>`).join('')}</div>`).join('')}

 warga:[['Utama',[['Beranda','home','beranda'],['Scan kemasan','scan','scan'],['Setor sampah','box','setor'],['Jejak kemasan','truck','jejak']]],
  ['Sekitar',[['Peta','pin','peta'],['Peringatan dini','bell','peringatan'],['Berita','news','berita']]],
  ['Reward',[['Misi','trophy','misi'],['Lencana dan level','star','lencana'],['Toko poin','gift','toko'],['Capaianku','users','peringkat'],['Pilah Cepat','play','kuis']]],
  ['Data',[['Statistik','chart','statistik1'],['Pola dan wawasan','sparkle','statistik2'],['Analitik data','table','analitik']]],
  ['Produsen',[['Pantau produsen','factory','produsen'],['Lapor kemasan','flag','lapor']]]],
 anak:[['Penjelajah Cilik',[['Beranda','home','beranda_anak'],['Scan kemasan','scan','scan'],['Pilah Cepat','play','kuis'],['Hadiahku','gift','toko'],['Lencana','star','lencana'],['Capaianku','users','peringkat']]]],
 pengawas:[['Pengelola',[['Dasbor','chart','dasbor'],['Peta sebaran','pin','peta'],['Buat pengumuman','bell','p_peringatan'],['Pencatat target','shield','p_kepatuhan']]],
  ['Lainnya',[['Peringatan dini','bell','peringatan'],['Berita','news','berita'],['Pantau produsen','factory','produsen']]]]};

function sideHtml(){const m=S.mode,l=lvOf(S.xp),a=NAVACT[cur&&cur.id]||(cur&&cur.id);

  ${(NAVS[m]||NAVS.warga).map(([g,it])=>`<h3>${g}</h3>${it.map(([t,i,id])=>`<button class="nv ${a===id?'on':''}" data-act="navgo" data-arg="${id}" ${a===id?'aria-current="page"':''}>${ic(i,20,'currentColor',2.2)}<span>${t}</span></button>`).join('')}`).join('')}
  <div class="sfoot"><div class="seg" role="tablist" aria-label="Mode pengguna">${[['warga','Warga'],['anak','Cilik'],['pengawas','Pengelola']].map(([k,l2])=>`<button role="tab" aria-selected="${k===m}" class="${k===m?'on':''}" data-act="sidemode" data-arg="${k}">${l2}</button>`).join('')}</div>
   <button class="nv ${a==='profil'?'on':''}" data-act="navgo" data-arg="profil">${ic('settings',20,'currentColor',2.2)}<span>Profil dan aksesibilitas</span></button>
   ${DEV?`<button class="lnk" data-act="opendrawer">${ic('menu',18,'currentColor',2.3)}Semua layar (pengembang)</button>`:''}</div>`}

ACT.navgo=el=>{const id=el.dataset.arg;if(cur&&cur.id===id)return;sfx('tap');stack=[];go(id,{},{dir:'fade',reset:1})};

function jump(id){const m=SUPS.includes(id)?'pengawas':id==='beranda_anak'?'anak':(S.mode==='pengawas'&&!['peta','peringatan','peringatan_d','berita','prodprofil','produsen','profil','splash','onb1','onb2','onb3','mode','masuk'].includes(id)||S.mode==='anak'&&!['kuis','lencana','toko','peringkat','misi','scan','hasil1','hasil2','jejak','splash','onb1','onb2','onb3','mode','masuk','profil'].includes(id)&&id!=='beranda_anak')?'warga':S.mode;
  if(m!==S.mode)setMode(m);
  $$('.modal-bg').forEach(x=>x.remove());stack=[];go(id,{},{dir:'fade',force:1,reset:1});if(id==='hasil1'||id==='hasil2'){}}
ACT.jump=el=>{jump(el.dataset.arg);document.body.classList.remove('drawer')};
ACT.sidemode=el=>{const m=el.dataset.arg;if(m===S.mode&&!el.closest('#drawer'))return;setMode(m);const home=HOME[m];stack=[];go(home,{},{dir:'fade',force:1,reset:1});toast('Mode: '+({warga:'Warga',anak:'Penjelajah Cilik',pengawas:'Pengelola'})[m],'user',1600);document.body.classList.remove('drawer')};
ACT.sidereset=()=>{ACT.doreset();document.body.classList.remove('drawer')};

drawer.addEventListener('click',e=>{if(e.target===drawer)document.body.classList.remove('drawer')});

  if(top&&top.id===id){stack.pop();HD=Math.max(0,HD-1);go(id,top.p,{dir:'back',noPush:1,nohist:1,force:1})}else{HD=Math.max(0,HD-1);go(id,{},{dir:'fade',reset:1,nohist:1,force:1})}});
addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(SCR[id]&&(!cur||cur.id!==id))jump(id)});

addEventListener('beforeunload',()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}});
window.__jejak={go,S,SCR,ORDER};
